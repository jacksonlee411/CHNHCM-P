          - inactive
          - not_effective
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - code
          - name
          - name_desc
      - name: filterField
        in: query
        description: One column predicate. All three filter parameters must be supplied together. AND with q and status; unreadable field rows cannot match.
        required: false
        schema:
          type: string
          enum: [code, name, status, effectiveDate]
      - name: filterOperator
        in: query
        description: code/name contain or equal literal trimmed case-insensitive text; status is or isAnyOf; effectiveDate compares the displayed record resolved at the server current business date (future first record before inception).
        required: false
        schema:
          type: string
          enum: [contains, equals, is, isAnyOf, before, after, onOrBefore, onOrAfter]
      - name: filterValue
        in: query
        description: Nonempty text up to 400 Unicode code points; status enum or comma-separated distinct active/inactive/not_effective values for isAnyOf; effectiveDate is YYYY-MM-DD without timezone. No empty/null operator. Omit all filter parameters to clear.
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 400
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          enum:
          - 20
          - 50
          - 100
