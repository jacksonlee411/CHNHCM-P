            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                  component:
                    type: string
                  check:
                    type: string
                required:
                - status
                - component
                - check
        default:
          description: Rejected or unavailable; unknown writes must resolve their original identity.
